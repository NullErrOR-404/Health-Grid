server:
  port: 8080

spring:
  application:
    name: healthgrid-backend

  # Java 21 Project Loom Virtual Threads - Handles 100k+ concurrent connections
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://db.cosnhycbvsxedogtejos.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${SUPABASE_DB_PASSWORD:HealthGrid2026Secure!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

healthgrid:
  jwt:
    secret: ${HEALTHGRID_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "https://healthgrid-app.vercel.app"
      - "https://healthgrid-live.vercel.app"
      - "https://healthgrid-network.vercel.app"
      - "https://healthgrid-nu.vercel.app"
