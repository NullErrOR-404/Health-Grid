# ==============================================================================
# HealthGrid (நலம் AI) - Production Full-Stack Docker Compose Orchestration
# National Community Healthcare & Emergency Response Platform
# 
# Services:
# 1. postgres: PostgreSQL 16 with pgvector extension (for vector semantic search)
# 2. redis: Redis 7 In-Memory Cache & Pub/Sub (for STOMP fleet telemetry & rate limiting)
# 3. backend: Spring Boot 3.3.4 (Java 21 Project Loom Virtual Threads)
# 4. frontend: React + Vite + Tailwind CSS reverse-proxied via Nginx
# 
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f backend
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Service 1: PostgreSQL 16 with pgvector Extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: healthgrid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: healthgrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: healthgrid_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthgrid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - healthgrid-network

  # ----------------------------------------------------------------------------
  # Service 2: Redis 7 Cluster (Telemetry Pub/Sub & Rate Limiter)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: healthgrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - healthgrid-network

  # ----------------------------------------------------------------------------
  # Service 3: Java 21 Spring Boot 3.3.4 Enterprise Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthgrid-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthgrid
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: healthgrid_secure_password_2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      HEALTHGRID_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      HEALTHGRID_CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173,https://healthgrid-app.vercel.app"
    networks:
      - healthgrid-network

  # ----------------------------------------------------------------------------
  # Service 4: React + Vite + Nginx Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthgrid-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - healthgrid-network

networks:
  healthgrid-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
